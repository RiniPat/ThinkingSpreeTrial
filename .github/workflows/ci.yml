name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm run typecheck:libs
      - name: Typecheck artifacts
        run: pnpm -r --filter "./artifacts/api-server" --filter "./artifacts/thinking-spree" --filter "./scripts" run typecheck

  build:
    runs-on: ubuntu-latest
    needs: typecheck
    env:
      PORT: "5000"
      BASE_PATH: "/"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm run typecheck:libs
      - run: pnpm --filter "@workspace/thinking-spree" run build
      - run: pnpm --filter "@workspace/api-server" run build
