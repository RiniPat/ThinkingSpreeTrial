# Render Blueprint — updated to include the cohort sync cron job.
#
# This is the FULL replacement for your current render.yaml. The web
# service block is identical to what you had; only the new cron block
# and the INTERNAL_TOKEN env var are additions.
#
# Render Cron Jobs are FREE on the free tier (separate from the 750-hour
# web service quota). So adding this costs nothing.

services:
  # ────────────────────────────────────────────────────────────────────
  # Web service — Express + React SPA (unchanged from your current setup)
  # ────────────────────────────────────────────────────────────────────
  - type: web
    name: thinking-spree
    runtime: node
    plan: free
    region: singapore
    buildCommand: "corepack enable && corepack prepare pnpm@10.33.4 --activate && pnpm run render:build"
    startCommand: "pnpm run render:start"
    healthCheckPath: /api/healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
      - key: SESSION_SECRET
        generateValue: true
      # NEW — shared secret the cron job uses to call /api/cron/*.
      # Generate a random 32-byte hex string in the Render dashboard.
      - key: INTERNAL_TOKEN
        generateValue: true
      # ─── Set manually after first deploy: ───
      # DATABASE_URL, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
      # GOOGLE_REDIRECT_URI, APP_BASE_URL

  # ────────────────────────────────────────────────────────────────────
  # NEW — Cron job that hits the cohort sync endpoint every 5 min.
  # Free tier: cron jobs are billed separately and the free plan covers
  # plenty of runs for this workload.
  # ────────────────────────────────────────────────────────────────────
  - type: cron
    name: thinking-spree-sync-cohorts
    runtime: node
    plan: free
    region: singapore
    # Every 5 minutes. Tune up/down as needed.
    # Common alternatives:
    #   "*/15 * * * *"   every 15 min
    #   "0 * * * *"      hourly
    #   "0 9-21 * * 1-5" hourly during India business hours, weekdays
    schedule: "*/5 * * * *"
    buildCommand: "corepack enable && corepack prepare pnpm@10.33.4 --activate && pnpm install --frozen-lockfile=false"
    # Single curl. Uses the same env vars resolved from this blueprint —
    # `fromService` references the web service so the token stays in sync.
    startCommand: |
      curl -sS -X POST \
        -H "Authorization: Bearer $INTERNAL_TOKEN" \
        "$APP_BASE_URL/api/cron/sync-cohorts"
    envVars:
      - key: INTERNAL_TOKEN
        fromService:
          type: web
          name: thinking-spree
          envVarKey: INTERNAL_TOKEN
      - key: APP_BASE_URL
        fromService:
          type: web
          name: thinking-spree
          envVarKey: APP_BASE_URL
