kind = "web"
previewPath = "/"
title = "Thinking Spree"
version = "1.0.0"
id = "artifacts/thinking-spree"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19125

[services.development]
run = "pnpm --filter @workspace/thinking-spree run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/thinking-spree", "run", "build" ]
publicDir = "artifacts/thinking-spree/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19125"
BASE_PATH = "/"
